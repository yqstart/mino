[package]
name = "mino-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mino 轻量终端与 SFTP GUI 应用"

[dependencies]
mino-core = { path = "../mino-core" }
eframe = { workspace = true }
egui = { workspace = true }
epaint = { workspace = true }
bytemuck = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
tokio = { workspace = true }
alacritty_terminal = "0.26"
arboard = { version = "3.6", features = ["image-data"] }
rfd = "0.15"
# 只保留 PNG 编解码：图标解码与剪贴板截图编码都用 PNG，
# 默认特性会拉入 avif/bmp/gif/jpeg/... 全套编解码器（编译时间与体积）。
image = { version = "0.25", default-features = false, features = ["png"] }

# macOS 原生窗口圆角（无边框窗口 contentView layer cornerRadius）。
# features 全局合并：追加 objc2-quartz-core 不会影响 eframe/winit 的既有实例。
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", features = ["std", "NSColor", "NSPasteboard", "NSPasteboardItem", "NSView", "NSWindow", "objc2-quartz-core"] }
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
raw-window-handle = "0.6.2"

[dev-dependencies]
accesskit = "0.24"
egui_kittest = { version = "0.36.1", features = ["eframe", "snapshot", "wgpu"] }
kittest = "0.4"
